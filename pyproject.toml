[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-search-engine"
version = "0.1.0"
description = "Approximate nearest neighbour indexes measured against exact search"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Kiruthika Subramani" }]
keywords = ["vector-search", "nearest-neighbour", "hnsw", "ivf", "quantisation", "recall"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[project.scripts]
vse = "vse.cli.main:main"

[tool.setuptools.packages.find]
include = ["vse*"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PL", "RUF"]
ignore = ["PLR0911", "PLR0913", "PLR0915", "PLR2004", "RUF012", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "ARG002", "SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
